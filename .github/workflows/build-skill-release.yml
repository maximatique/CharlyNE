name: Validate standalone skill release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/materialize_v140_runtime.py
      - run: python scripts/build_skill_release.py
      - run: |
          unzip -t skill.zip
          test "$(unzip -Z1 skill.zip | wc -l)" -eq 11
          cmp skill.zip releases/v1.4.0/skill.zip
